[package]
name = "opencode-api-proxy"
version = "1.3.0"
edition = "2024"
description = "Free OpenAI/Anthropic-compatible API proxy over OpenCode and Kilo models, with rotating proxy pool and autopilot"
license = "AGPL-3.0-or-later"
repository = "https://github.com/alvaro-co/opencode-api-proxy"

[dependencies]
hyper = { version = "1.11", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "client-legacy", "tokio"] }
hyper-rustls = { version = "0.26", features = ["webpki-tokio", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1.12"
tokio = { version = "1.53", default-features = false, features = ["net", "rt", "rt-multi-thread", "signal", "macros", "sync", "time", "io-util"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fastrand = "2.5"
memchr = "2.8"
parking_lot = "0.12"
hyper-proxy2 = { version = "0.1", default-features = false, features = ["rustls-webpki"] }
headers = "0.4"
tokio-rustls = "0.25"
rustls = "0.22"
webpki-roots = "0.26"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
