[package]
name = "opencode-proxy"
version = "1.0.0"
edition = "2021"

[dependencies]
hyper = { version = "1.4", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "client-legacy", "tokio"] }
hyper-rustls = { version = "0.27", features = ["webpki-tokio", "http1", "http2"] }
http-body-util = "0.1"
tokio = { version = "1.38", features = ["net", "rt-multi-thread", "signal", "macros", "sync", "time"] }
tokio-stream = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde_json = "1.0"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
